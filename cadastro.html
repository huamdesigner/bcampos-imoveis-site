<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Cadastro de clientes - BCampos Imóveis">

<title>Cadastro | BCampos Imóveis</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

    .cadastro-page {
        min-height: calc(100vh - 82px);
        padding: 80px 0;
        background: linear-gradient(135deg, #f7f8fa, #eef0f3);
    }

    .cadastro-container {
        max-width: 700px;
        margin: 0 auto;
    }

    .cadastro-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .cadastro-header h1 {
        margin-top: 10px;
        color: #172d5a;
        font-family: "Montserrat", sans-serif;
        font-size: 40px;
    }

    .cadastro-header p {
        margin-top: 12px;
        color: #5d6572;
    }

    .cadastro-box {
        padding: 40px;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 15px 40px rgba(13, 28, 59, 0.10);
    }

    .form-grupo {
        margin-bottom: 22px;
    }

    .form-grupo label {
        display: block;
        margin-bottom: 7px;
        color: #172d5a;
        font-weight: 700;
    }

    .form-grupo input {
        width: 100%;
        min-height: 50px;
        padding: 0 15px;
        border: 1px solid #d4d8df;
        border-radius: 7px;
        font-family: "Open Sans", sans-serif;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-grupo input:focus {
        border-color: #31558f;
        box-shadow: 0 0 0 3px rgba(49, 85, 143, 0.10);
    }

    .btn-cadastro {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 7px;
        background: #b5262d;
        color: #ffffff;
        font-family: "Montserrat", sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-cadastro:hover {
        background: #941d24;
        transform: translateY(-2px);
    }

    .btn-cadastro:disabled {
        opacity: 0.7;
        cursor: wait;
        transform: none;
    }

    .voltar {
        display: block;
        width: fit-content;
        margin: 25px auto 0;
        color: #172d5a;
        font-weight: 700;
        text-decoration: none;
    }

    .voltar:hover {
        color: #b5262d;
    }

    #mensagemCadastro {
        display: none;
        margin-top: 20px;
        padding: 15px;
        border-radius: 7px;
        text-align: center;
        font-weight: 600;
    }

    @media (max-width: 600px) {

        .cadastro-page {
            padding: 50px 0;
        }

        .cadastro-box {
            padding: 25px 20px;
        }

        .cadastro-header h1 {
            font-size: 30px;
        }

    }

</style>

</head>

<body>

<header class="header">

    <div class="container header-content">

        <a href="index.html" class="logo">

            <span class="logo-b">B</span>

            <span>
                CAMPO<span class="logo-red">S</span>
            </span>

            <small>IMÓVEIS</small>

        </a>

        <a href="index.html" class="btn btn-primary">
            Voltar ao site
        </a>

    </div>

</header>

<main class="cadastro-page">

    <div class="container cadastro-container">

        <div class="cadastro-header">

            <span class="section-label">
                BCAMPOS IMÓVEIS
            </span>

            <h1>
                Cadastre-se
            </h1>

            <p>
                Faça seu cadastro para fazer parte
                do nosso projeto.
            </p>

        </div>

        <div class="cadastro-box">

            <form id="cadastroForm">

                <div class="form-grupo">

                    <label for="nomeCliente">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nomeCliente"
                        name="nomeCliente"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        minlength="3"
                        required>

                </div>

                <div class="form-grupo">

                    <label for="emailCliente">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailCliente"
                        name="emailCliente"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required>

                </div>

                <div class="form-grupo">

                    <label for="telefoneCliente">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefoneCliente"
                        name="telefoneCliente"
                        placeholder="(31) 99999-9999"
                        autocomplete="tel"
                        maxlength="15"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn-cadastro"
                    id="botaoCadastro">

                    Quero me cadastrar

                </button>

                <div id="mensagemCadastro"></div>

            </form>

            <a
                href="index.html"
                class="voltar">

                ← Voltar para a página inicial

            </a>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://smktdcolcyiylcnppzrb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r5zjiheogq2h5JyRCQknvg_uqW8b8Wm";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTOS
========================================== */

const cadastroForm =
    document.getElementById("cadastroForm");

const mensagem =
    document.getElementById("mensagemCadastro");

const botaoCadastro =
    document.getElementById("botaoCadastro");

const campoNome =
    document.getElementById("nomeCliente");

const campoEmail =
    document.getElementById("emailCliente");

const campoTelefone =
    document.getElementById("telefoneCliente");


/* ==========================================
   MÁSCARA DO TELEFONE
========================================== */

campoTelefone.addEventListener(
    "input",
    function () {

        let telefone =
            campoTelefone.value.replace(/\D/g, "");

        if (telefone.length > 11) {
            telefone = telefone.substring(0, 11);
        }

        if (telefone.length <= 10) {

            telefone =
                telefone.replace(
                    /^(\d{2})(\d)/,
                    "($1) $2"
                );

            telefone =
                telefone.replace(
                    /(\d{4})(\d)/,
                    "$1-$2"
                );

        } else {

            telefone =
                telefone.replace(
                    /^(\d{2})(\d)/,
                    "($1) $2"
                );

            telefone =
                telefone.replace(
                    /(\d{5})(\d)/,
                    "$1-$2"
                );

        }

        campoTelefone.value = telefone;

    }
);


/* ==========================================
   MENSAGEM
========================================== */

function mostrarMensagem(
    texto,
    tipo
) {

    mensagem.style.display = "block";

    if (tipo === "sucesso") {

        mensagem.style.background = "#e8f7ef";
        mensagem.style.color = "#176b3c";

    }

    else if (tipo === "erro") {

        mensagem.style.background = "#f8d7da";
        mensagem.style.color = "#842029";

    }

    else {

        mensagem.style.background = "#fff3cd";
        mensagem.style.color = "#856404";

    }

    mensagem.textContent = texto;

}


/* ==========================================
   CADASTRO
========================================== */

cadastroForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const nome =
            campoNome.value.trim();

        const email =
            campoEmail.value.trim().toLowerCase();

        const telefone =
            campoTelefone.value.trim();


        /* ==================================
           VALIDA NOME
        ================================== */

        if (nome.length < 3) {

            mostrarMensagem(
                "Digite seu nome completo.",
                "erro"
            );

            campoNome.focus();

            return;

        }


        /* ==================================
           VALIDA E-MAIL
        ================================== */

        const emailValido =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailValido.test(email)) {

            mostrarMensagem(
                "Digite um e-mail válido.",
                "erro"
            );

            campoEmail.focus();

            return;

        }


        /* ==================================
           VALIDA TELEFONE
        ================================== */

        const telefoneNumeros =
            telefone.replace(/\D/g, "");


        if (
            telefoneNumeros.length < 10 ||
            telefoneNumeros.length > 11
        ) {

            mostrarMensagem(
                "Digite um telefone válido.",
                "erro"
            );

            campoTelefone.focus();

            return;

        }


        /* ==================================
           ENVIO
        ================================== */

        mostrarMensagem(
            "Enviando cadastro...",
            "carregando"
        );


        botaoCadastro.disabled = true;

        botaoCadastro.textContent =
            "Enviando...";


        try {


            const { error } =
                await supabaseClient
                    .from("clientes")
                    .insert([
                        {
                            nome: nome,
                            email: email,
                            telefone: telefone
                        }
                    ]);


            /* ==================================
               ERRO
            ================================== */

            if (error) {

                console.error(
                    "Erro Supabase:",
                    error
                );


                /*
                 * E-MAIL DUPLICADO
                 *
                 * O código 23505 significa
                 * violação de UNIQUE.
                 */

                if (error.code === "23505") {

                    mostrarMensagem(
                        "Este e-mail já está cadastrado.",
                        "erro"
                    );

                }

                else {

                    mostrarMensagem(
                        "Não foi possível realizar o cadastro. Tente novamente.",
                        "erro"
                    );

                }


                return;

            }


            /* ==================================
               SUCESSO
            ================================== */

            mostrarMensagem(
                "Cadastro realizado com sucesso!",
                "sucesso"
            );


            cadastroForm.reset();


        }

        catch (erro) {

            console.error(
                "Erro inesperado:",
                erro
            );


            mostrarMensagem(
                "Ocorreu um erro. Tente novamente.",
                "erro"
            );

        }

        finally {

            botaoCadastro.disabled = false;

            botaoCadastro.textContent =
                "Quero me cadastrar";

        }

    }
);

</script>

</body>

</html>
